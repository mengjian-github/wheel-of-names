name = "shipsite-site-prj-f45e7fee-046-wheel-of-names"
main = "worker.mjs"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
NEXT_PUBLIC_SITE_URL = "https://prj-f45e7fee-046-wheel-of-names.shipsite-preview.dev"
SHIPSITE_ENVIRONMENT = "production"

# The Worker reads DB on every environment (contact form, sign-in, saved
# documents). The root block is what a plain `wrangler deploy` (and the dev
# Worker) binds; preview and production keep their own database below.
[[d1_databases]]
binding = "DB"
database_name = "shipsite-pay-prj_f45e7fee-046-preview"
database_id = "81c17e29-6039-44ef-b1ab-8481cdeaa72f"

[env.preview]
name = "shipsite-site-prj-f45e7fee-046-wheel-of-names-preview"
workers_dev = true

[env.preview.assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = true

[env.preview.observability]
enabled = true

[env.preview.version_metadata]
binding = "CF_VERSION_METADATA"

[env.preview.vars]
NEXT_PUBLIC_SITE_URL = "https://prj-f45e7fee-046-wheel-of-names.shipsite-preview.dev"
SHIPSITE_ENVIRONMENT = "preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "shipsite-pay-prj_f45e7fee-046-preview"
database_id = "81c17e29-6039-44ef-b1ab-8481cdeaa72f"

[env.production]
name = "shipsite-site-prj-f45e7fee-046-wheel-of-names"
workers_dev = true

[env.production.assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = true

[env.production.observability]
enabled = true

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"

[env.production.vars]
NEXT_PUBLIC_SITE_URL = "https://prj-f45e7fee-046-wheel-of-names.shipsite-preview.dev"
SHIPSITE_ENVIRONMENT = "production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "shipsite-pay-prj_f45e7fee-046"
database_id = "faf62cde-f195-4630-9417-c8773882b940"
